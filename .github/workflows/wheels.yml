name: Build wheels and release

# Every push to main builds and tests the wheels. If the version in pyproject.toml
# differs from the latest version on PyPI, the commit is tagged, a GitHub release is
# created and the package is published to PyPI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PACKAGE: opencosmors

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # OpenMP runtime for macOS (Apple clang ships none), taken from conda-forge
      - uses: mamba-org/setup-micromamba@v3.2.1
        if: runner.os == 'macOS'
        with:
          environment-name: omp
          create-args: llvm-openmp
          condarc: |
            channels:
              - conda-forge
      - name: Locate llvm-openmp
        if: runner.os == 'macOS'
        run: echo "OMP_PREFIX=$MAMBA_ROOT_PREFIX/envs/omp" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@v3.4.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Tag and release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compare the built version with the latest version on PyPI
        id: version
        run: |
          sdist="$(ls dist/${PACKAGE}-*.tar.gz)"
          built="$(basename "$sdist" .tar.gz)"
          built="${built#${PACKAGE}-}"
          code="$(curl --silent --output pypi.json --write-out '%{http_code}' "https://pypi.org/pypi/${PACKAGE}/json")"
          if [[ $code == 200 ]]; then
            published="$(jq --raw-output .info.version pypi.json)"
          elif [[ $code == 404 ]]; then
            published="none"
          else
            echo "Could not query PyPI (HTTP $code)"; exit 1
          fi
          echo "Built version: $built, latest published version: $published"
          echo "version=$built" >> "$GITHUB_OUTPUT"
          if [[ $built != "$published" && $GITHUB_EVENT_NAME == "push" && $GITHUB_REF_NAME == "main" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the commit and create a GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            gh release create "$TAG" dist/*.tar.gz --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
